[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
ffi = false

# Read-only access to the cached Pyth VAA fixtures the fork test replays. Scoped to that one
# directory; ffi stays off, so the test stays deterministic (no live Hermes fetch at run time).
# Read-write access to the deployment files the testnet scripts write and read for the demo app.
fs_permissions = [
    {access = "read", path = "./test/fork/fixtures"},
    {access = "read-write", path = "./app/src/config/deployments"},
]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "solady/=lib/solady/src/",
    "forge-std/=lib/forge-std/src/",
    "@pythnetwork/pyth-sdk-solidity/=lib/pyth-sdk-solidity/",
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 1000
depth = 100
fail_on_revert = false

# Testnet tooling (script/testnet): its own suite, so the protocol figures above stay unchanged.
# FOUNDRY_PROFILE=testnet forge test
[profile.testnet]
test = "script/testnet/test"

# Faster local iteration: same tests, fewer randomized runs.
[profile.lite.fuzz]
runs = 64

[profile.lite.invariant]
runs = 16
depth = 32

# Pre-merge depth, run locally with FOUNDRY_PROFILE=deep (CI runs the default profile).
[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs = 5000
depth = 200

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "preserve"
