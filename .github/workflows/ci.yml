name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  FOUNDRY_PROFILE: default

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Same version as the local toolchain used for the figures in the docs
          version: v1.7.1

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Same version as the local toolchain used for the figures in the docs
          version: v1.7.1

      - name: Run tests
        run: forge test -vvv

      - name: Run testnet tooling tests
        run: FOUNDRY_PROFILE=testnet forge test -vvv

  lint:
    name: Solhint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install lint toolchain
        run: npm install --no-audit --no-fund

      - name: Solhint
        run: npm run lint

  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          # The parity step deploys the contracts to a local chain
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Same version as the local toolchain used for the figures in the docs
          version: v1.7.1

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # One step, so the anvil node lives through the tests. It is started here with its output detached:
      # a background process that keeps the step's output open can keep the step from finishing.
      - name: Parity with the contracts
        run: |
          anvil --silent --chain-id 31337 > /dev/null 2>&1 &
          for _ in $(seq 1 50); do cast chain-id >/dev/null 2>&1 && break; sleep 0.2; done
          ./scripts/local-chain.sh
          LOCAL_RPC=http://127.0.0.1:8545 npx vitest run scripts

      - name: Build
        run: npm run build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Same version as the local toolchain used for the figures in the docs
          version: v1.7.1

      - name: Run coverage
        run: forge coverage --report lcov --report summary
